# compose.yaml — Gestione Consegne
#
# Profili disponibili:
#   (nessun profilo)  DB_BACKEND=json   — dati in file JSON su volume
#   --profile mysql   DB_BACKEND=mysql  — dati in MySQL 8.4
#   --profile postgres DB_BACKEND=postgres — dati in PostgreSQL 16
#
# Configurazione tramite file .env nella stessa directory:
#
#   APP_PORT=8080          porta esposta sull'host (default: 8080)
#   DB_BACKEND=json        backend dati: json | mysql | postgres
#   DB_NAME=gestione_consegne
#   DB_USER=gcuser
#   DB_PASSWORD=cambiami   (obbligatorio se DB_BACKEND != json)
#
# Avvio esempi:
#   JSON:      docker compose up -d
#   MySQL:     docker compose --profile mysql up -d
#   Postgres:  docker compose --profile postgres up -d
#
# Importazione dati originali (una sola volta):
#   docker compose run --rm -v ./dati.json:/import/dati.json:ro app python import_data.py

name: gestione-consegne

services:

  app:
    image: undermix/gestione-consegne:latest
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DB_BACKEND:  "${DB_BACKEND:-json}"
      DATA_DIR:    /data
      DB_HOST:     db
      DB_PORT:     "${DB_PORT:-3306}"
      DB_NAME:     "${DB_NAME:-gestione_consegne}"
      DB_USER:     "${DB_USER:-gcuser}"
      DB_PASSWORD: "${DB_PASSWORD:-}"
      # Backup (vedi README): secondi tra due backup automatici (default 21600 = 6 ore, 0 = nessuno) e file conservati (30)
      BACKUP_INTERVAL: "${BACKUP_INTERVAL:-}"
      BACKUP_KEEP:     "${BACKUP_KEEP:-}"
    volumes:
      - app_data:/data          # dati (json) e cartella backup/ (tutti i backend)
    depends_on:
      db_mysql:
        condition: service_healthy
        required: false
      db_postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped
    # Sicurezza: filesystem di sistema in sola lettura;
    # solo /data e /tmp sono scrivibili (tramite tmpfs o volume).
    read_only: true
    tmpfs:
      - /tmp

  # ── Migrazione dei dati verso la V2 (una tantum) ─────────────────────────
  # Senza MIGRATE_EXECUTE=1 stampa solo un rapporto e non scrive nulla. La destinazione è il backend
  # configurato sopra (DB_BACKEND, volume app_data per json): deve essere NUOVA (volume o database vuoti).
  # Opzioni e variabili SRC_*: vedi l'intestazione di migrate.py e il README.
  #
  #   docker compose --profile migrate run --rm migrate                      # solo rapporto
  #   MIGRATE_EXECUTE=1 docker compose --profile migrate run --rm migrate   # migrazione vera
  #
  # (con un backend DB aggiungere il profilo del database, es. --profile postgres --profile migrate)
  migrate:
    profiles: ["migrate"]
    image: undermix/gestione-consegne:latest
    command: ["python", "migrate.py"]
    environment:
      DB_BACKEND:  "${DB_BACKEND:-json}"
      DATA_DIR:    /data
      DB_HOST:     db
      DB_PORT:     "${DB_PORT:-3306}"
      DB_NAME:     "${DB_NAME:-gestione_consegne}"
      DB_USER:     "${DB_USER:-gcuser}"
      DB_PASSWORD: "${DB_PASSWORD:-}"
      MIGRATE_EXECUTE:       "${MIGRATE_EXECUTE:-}"
      MIGRATE_SOURCE_KIND:   "${MIGRATE_SOURCE_KIND:-v1}"
      MIGRATE_SQUADRA_NON_ASSEGNATA: "${MIGRATE_SQUADRA_NON_ASSEGNATA:-}"
      MIGRATE_NEGOZIO_NOME:  "${MIGRATE_NEGOZIO_NOME:-}"
      MIGRATE_CREATE_DB:     "${MIGRATE_CREATE_DB:-}"
      MIGRATE_KEEP_ORPHANS:  "${MIGRATE_KEEP_ORPHANS:-}"
      SRC_BACKEND:     "${SRC_BACKEND:-json}"
      SRC_DATA_DIR:    /source
      SRC_FILE:        "${SRC_FILE:-/source/dati.json}"
      SRC_DB_HOST:     "${SRC_DB_HOST:-}"
      SRC_DB_PORT:     "${SRC_DB_PORT:-}"
      SRC_DB_NAME:     "${SRC_DB_NAME:-}"
      SRC_DB_USER:     "${SRC_DB_USER:-}"
      SRC_DB_PASSWORD: "${SRC_DB_PASSWORD:-}"
    volumes:
      - app_data:/data                                       # destinazione (backend json)
      - "${MIGRATE_DIR:-./migration}:/migration"             # file di esportazione = backup della sorgente
      - "${SRC_HOST_DIR:-./migration/sorgente}:/source:ro"   # sorgente json o dati.json (sola lettura)
    depends_on:
      db_mysql:
        condition: service_healthy
        required: false
      db_postgres:
        condition: service_healthy
        required: false
    restart: "no"
    healthcheck:
      disable: true
    read_only: true
    tmpfs:
      - /tmp

  # ── MySQL 8.4 ────────────────────────────────────────────────────────────
  db_mysql:
    profiles: ["mysql"]
    image: mysql:8.4
    environment:
      MYSQL_DATABASE:            "${DB_NAME:-gestione_consegne}"
      MYSQL_USER:                "${DB_USER:-gcuser}"
      MYSQL_PASSWORD:            "${DB_PASSWORD:?Imposta DB_PASSWORD nel file .env}"
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db_data:/var/lib/mysql
    # Nessuna porta esposta sull'host: il DB è raggiungibile solo dall'app
    # tramite la rete interna Docker.
    expose:
      - "3306"
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - --host=localhost
        - --user=${DB_USER:-gcuser}
        - --password=${DB_PASSWORD:-}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # L'app e la migrazione raggiungono il database come host "db" (DB_HOST): senza alias il nome
    # del servizio sarebbe db_mysql / db_postgres e la risoluzione fallirebbe.
    networks:
      default:
        aliases:
          - db
    restart: unless-stopped

  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────
  db_postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       "${DB_NAME:-gestione_consegne}"
      POSTGRES_USER:     "${DB_USER:-gcuser}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Imposta DB_PASSWORD nel file .env}"
    volumes:
      - db_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DB_USER:-gcuser} -d ${DB_NAME:-gestione_consegne}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    # L'app e la migrazione raggiungono il database come host "db" (DB_HOST): senza alias il nome
    # del servizio sarebbe db_mysql / db_postgres e la risoluzione fallirebbe.
    networks:
      default:
        aliases:
          - db
    restart: unless-stopped

volumes:
  app_data:   # dati JSON o punto di mount per import
  db_data:    # dati MySQL o PostgreSQL
