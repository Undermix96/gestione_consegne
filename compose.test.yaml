# Suite di test di storage.py su tutti i backend (json, PostgreSQL, MySQL), con database TEMPORANEI.
#
#   docker compose -f compose.test.yaml up --build --exit-code-from tests
#   docker compose -f compose.test.yaml down        # pulizia (nessun dato da conservare)
#
# Sicurezza:
# - nome progetto diverso dalla produzione: reti, container e volumi separati
# - i database di test non hanno volumi (tmpfs) e nessuna porta pubblicata
# - il nome del database finisce per "_test": la suite rifiuta di svuotare qualsiasi altro database
# - il codice dell'app e' quello dell'immagine appena compilata; tests/ e' montata in sola lettura
#
# Opzioni: TEST_VERBOSE=1 per l'elenco dei singoli test;
#          TEST_BACKENDS="json postgres" (o solo uno) per limitare i backend provati.
name: gestione-consegne-test

services:
  postgres:
    image: postgres:16-alpine
    # solo per i test: piu' veloce e senza il rumore dei vincoli violati di proposito
    command: ["postgres", "-c", "fsync=off", "-c", "log_min_messages=fatal"]
    environment:
      POSTGRES_DB: gestione_consegne_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      # secondo database (sorgente V1 dei test di integrazione), creato solo all'avvio del container temporaneo
      - ./tests/db-init/postgres.sql:/docker-entrypoint-initdb.d/10-sorgente.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d gestione_consegne_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  mysql:
    image: mysql:8.4
    command: ["--skip-log-bin", "--innodb-flush-log-at-trx-commit=0"]   # solo per i test
    environment:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_DATABASE: gestione_consegne_test
      MYSQL_USER: test
      MYSQL_PASSWORD: test
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./tests/db-init/mysql.sql:/docker-entrypoint-initdb.d/10-sorgente.sql:ro
    healthcheck:
      # via TCP: durante l'inizializzazione il server temporaneo ascolta solo sul socket
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -utest -ptest --silent"]
      interval: 3s
      timeout: 5s
      retries: 40

  tests:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
    command: ["sh", "tests/run_all.sh"]
    environment:
      TEST_BACKENDS: "${TEST_BACKENDS:-json postgres mysql}"
      TEST_VERBOSE: "${TEST_VERBOSE:-0}"
      TEST_INTEGRATION: "${TEST_INTEGRATION:-1}"       # 0 = salta i test di integrazione (lenti)
      PYTHONDONTWRITEBYTECODE: "1"
      DB_NAME: gestione_consegne_test
      DB_USER: test
      DB_PASSWORD: test
    volumes:
      - ./tests:/app/tests:ro
      # per verificare che gli strumenti di backup dell'immagine coincidano con i database del compose
      - ./compose.yaml:/app/compose.yaml:ro
      - ./compose.test.yaml:/app/compose.test.yaml:ro
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      disable: true

  # Controlli statici del frontend e test di sha256.js (Node serve solo qui, mai nell'app):
  #   docker compose -f compose.test.yaml run --rm jstests
  jstests:
    image: node:22-alpine
    profiles: ["js"]
    working_dir: /app
    command: ["node", "tests/js/run.mjs"]
    volumes:
      - ./js:/app/js:ro
      - ./index.html:/app/index.html:ro
      - ./tests/js:/app/tests/js:ro
    read_only: true
    tmpfs:
      - /tmp
